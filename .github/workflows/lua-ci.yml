name: Lua CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua-version: ['5.4']

    steps:
    - name: Code Checkout
      uses: actions/checkout@v4

    - name: Install Lua
      uses: |
        sudo apt-get update
        sudo apt-get install -y build-essential libreadline-dev unzip

    - name: Install LuaRocks
      run: |
        wget https://luarocks.org/releases/luarocks-3.9.2.tar.gz
        tar -xzf luarocks-3.9.2.tar.gz
        cd luarocks-3.9.2
        ./configure --with-lua-bin=/usr/local/bin --with-lua-include=/usr/local/include
        make
        sudo make install
        cd ..
        luarocks --version

    - name: Instalal Busted (test runner)
      run: |
        luarocks install busted

    - name: Install dependencies 
      run: |
        luarocks install --only-deps *.rockspec --local || true

    - name: Run Tests
      run: |
        busted --verbose
name: Lua CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua-version: ['5.4']

    steps:
    - name: Code Checkout
      uses: actions/checkout@v4

    - name: Lua config
      uses: leafo/gh-actions-lua@v8
      with:
        lua-version: ${{ matrix.lua-version }}

    - name: build
      run: |
        luarocks install busted
        luarocks make

    - name: Instalal Busted (test runner)
      run: |
        luarocks install busted

    - name: Install dependencies 
      run: |
        luarocks install --only-deps *.rockspec --local || true

    - name: Run Tests
      run: |
        busted --verbose